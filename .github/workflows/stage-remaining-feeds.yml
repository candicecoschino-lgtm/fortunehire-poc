name: Stage remaining employer feeds
on:
  push:
    branches: [verify-all52-20261113]
    paths: ['.github/workflows/stage-remaining-feeds.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source readers
        working-directory: fortunehire
        run: python -m unittest discover -s test -p 'test_*.py'
      - name: Collect isolated employer samples without changing production
        working-directory: fortunehire
        run: |
          python - <<'PY'
          import sys,json
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import collect_jobs as c
          c.SOURCES={"walmart":["careers.walmart.com","Retail"],"disney":["www.disneycareers.com","Entertainment"],"caterpillar":["careers.caterpillar.com","Industrials"],"cisco":["careers.cisco.com","Technology"],"humana":["careers.humana.com","Health Care"],"abbott":["www.jobs.abbott","Health Care"],"cencora":["careers.cencora.com","Health Care"],"cvs-health":["jobs.cvshealth.com","Health Care"],"ups":["www.jobs-ups.com","Transportation"],"coca-cola":["coke.wd1.myworkdayjobs.com","Consumer Goods"],"fannie-mae":["fanniemae.wd1.myworkdayjobs.com","Financials"],"cardinal-health":["jobs.cardinalhealth.com","Health Care"],"bank-of-america":["careers.bankofamerica.com","Financials"]}
          c.SOURCES={k:tuple(v) for k,v in c.SOURCES.items()}
          root=Path('feed-staging')
          (root/'public/data').mkdir(parents=True,exist_ok=True)
          (root/'automation').mkdir(exist_ok=True)
          c.atomic_json(root/'public/data/jobs.json',{'schemaVersion':1,'updatedAt':'2026-11-13','jobs':[]})
          c.run(root,max_new=20)
          data=json.load(open(root/'public/data/jobs.json'))
          state=json.load(open(root/'automation/state.json'))
          for job in data['jobs']: print('STAGED_JOB',json.dumps(job,ensure_ascii=True),flush=True)
          for key,report in data['automation']['sources'].items(): print('STAGED_SOURCE',json.dumps({'companyId':key,'report':report}),flush=True)
          for key,report in state.items(): print('STAGED_STATE',json.dumps({'companyId':key,'state':report}),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: staged-official-employer-postings
          path: fortunehire/feed-staging/
