name: Verify Meta public job sitemap and original posting dates
on:
  push:
    paths: ['.github/workflows/verify-meta.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test evidence readers
        working-directory: fortunehire
        run: python -m unittest discover -s test -p 'test_*.py'
      - name: Collect bounded samples and independently refresh Meta
        working-directory: fortunehire
        run: |
          python - <<'PY'
          import sys,json,tempfile
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import collect_jobs as c
          c.SOURCES={'meta':('www.metacareers.com','Communication Services')}
          root=Path(tempfile.mkdtemp())
          c.atomic_json(root/'public/data/jobs.json',{'schemaVersion':1,'jobs':[]})
          ok=False
          for attempt in range(3):
              ok=c.run(root,max_new=20)
              report=json.loads((root/'public/data/collection-status.json').read_text())
              print('META_INITIAL_REPORT',json.dumps(report))
              jobs=json.loads((root/'public/data/jobs.json').read_text())['jobs']
              if not ok or jobs:break
          refreshed=c.run(root,max_new=0) if ok and jobs else False
          data=json.loads((root/'public/data/jobs.json').read_text())
          print('META_JOBS',json.dumps(data['jobs']))
          print('META_SOURCES',json.dumps(data['automation']['sources']))
          print('META_STATES',json.dumps(json.loads((root/'automation/state.json').read_text())))
          print('META_VERIFIED',bool(ok and refreshed and data['jobs']))
          PY
