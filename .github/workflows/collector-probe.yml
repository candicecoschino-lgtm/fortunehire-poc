name: Collector connection probe
on:
  push:
    paths: ['.github/workflows/collector-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public search and posting formats
        shell: python
        run: |
          import urllib.request, urllib.parse, urllib.error, urllib.robotparser, re, json
          from html import unescape
          from concurrent.futures import ThreadPoolExecutor
          def probe(host):
              base='https://'+host
              def get(path):
                  req=urllib.request.Request(urllib.parse.urljoin(base,path),headers={'User-Agent':'FortuneHirePilot/0.1 (+https://fortunehire.netlify.app/)'})
                  try:
                      with urllib.request.urlopen(req,timeout=30) as r: return r.status,r.read(3000000).decode('utf-8')
                  except urllib.error.HTTPError as e: return e.code,e.read(2000).decode('utf-8',errors='replace')
              status,robots=get('/robots.txt')
              out={'host':host,'robots_status':status,'robots':robots[:4000]}
              rp=urllib.robotparser.RobotFileParser();rp.parse(robots.splitlines() if status==200 else [])
              if status==200 and not rp.can_fetch('FortuneHirePilot','/search-jobs'):
                  out['blocked_by_robots']=True
                  return out
              status,body=get('/search-jobs');out['search_status']=status;out['search_preview']=body[:1200]
              m=re.search(r'<(?:section|div)\b[^>]*id="search-results"[^>]*>',body)
              out['search_tag']=m.group(0) if m else None
              links=re.findall(r'href="([^"]*/job/[^"]+)"',body)
              out['sample_link']=unescape(links[0]) if links else None
              if links:
                  status,detail=get(unescape(links[0]));out['detail_status']=status
                  scripts=re.findall(r'<script\b[^>]*type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',detail,re.S|re.I)
                  out['structured']=[]
                  for s in scripts:
                      try:
                          j=json.loads(s)
                          out['structured'].append({k:v for k,v in j.items() if k!='description'})
                      except Exception as e: out['parse_error']=str(e)
                  out['description_tag']=bool(re.search(r'class="[^"]*ats-description',detail))
              if False:
                  qs=urllib.parse.urlencode({'CurrentPage':2,'RecordsPerPage':15,'SearchResultsModuleName':'Search Results','SearchType':5,'SortCriteria':5,'SortDirection':1})
                  status,page=get('/search-jobs/results?'+qs);out['pagination_status']=status;out['pagination_preview']=page[:450]
              for path in ['/sitemap.xml','/sitemap']:
                  status,body=get(path);out[path]={'status':status,'preview':body[:1600]}
              return out
          with ThreadPoolExecutor(max_workers=3) as pool:
              for out in pool.map(probe,['jobs.boeing.com','jobs.citi.com','careers.unitedhealthgroup.com']):
                  print(json.dumps(out))
