name: Check Home Depot public role access
on:
  push:
    paths: ['.github/workflows/verify-home-depot-public.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify current official individual role without publication
        working-directory: fortunehire
        run: |
          python - <<'PY'
          import sys,json
          sys.path.insert(0,'scripts')
          import collect_jobs as c
          row={}
          try:
              url='https://careers.homedepot.com/job/24150008/pro-experience-manager-layton-ut/'
              cl=c.Client('careers.homedepot.com')
              status,body=cl.get(url)
              p=c.Page(body)
              row.update(status=status,canonical=p.canonical,postings=[{k:v for k,v in j.items() if k!='description'} for s in p.scripts for j in c.postings(json.loads(s))])
          except Exception as e:row['error']=str(e)
          print('HOME_DEPOT_REVIEW',json.dumps(row))
          PY
