name: Refresh official jobs
on:
  schedule:
    - cron: '17 10,22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-jobs.yml'
      - 'fortunehire/scripts/collect_jobs.py'
      - 'fortunehire/test/test_collector.py'
permissions:
  contents: write
concurrency:
  group: fortunehire-job-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fortunehire
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test lifecycle and filters before collection
        run: |
          python -m unittest discover -s test -p 'test_*.py' -v
          npm test
      - name: Check employer postings
        id: collect
        continue-on-error: true
        run: python scripts/collect_jobs.py
      - name: Validate the publication dataset
        run: node scripts/validate-jobs.mjs
      - name: Record refresh status
        if: always()
        run: |
          if [ -f public/data/collection-status.json ]; then
            echo '### Official job collection' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat public/data/collection-status.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish validated data and retain previous successful records
        run: |
          git config user.name 'fortunehire-updates'
          git config user.email 'fortunehire-updates@users.noreply.github.com'
          git add public/data/jobs.json public/data/collection-status.json automation/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official FortuneHire pilot postings'
            git push origin HEAD:main
          fi
      - name: Flag any collection failure
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'Some employer checks failed. Previous records were retained without changing their freshness dates.'
          exit 1

