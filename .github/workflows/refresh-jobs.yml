name: Refresh official jobs
on:
  schedule:
    - cron: '17 10,22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-jobs.yml'
      - 'fortunehire/scripts/collect_jobs.py'
      - 'fortunehire/scripts/publish_refresh.py'
      - 'fortunehire/test/test_publish_refresh.py'
      - 'fortunehire/scripts/employment_type.py'
      - 'fortunehire/test/test_employment_type.py'
      - 'fortunehire/scripts/location_worksite.py'
      - 'fortunehire/test/test_location_worksite.py'
      - 'fortunehire/scripts/jpm_public.py'
      - 'fortunehire/test/test_jpm_scope.py'
      - 'fortunehire/scripts/meta_public.py'
      - 'fortunehire/test/test_meta.py'
      - 'fortunehire/scripts/crawler_rules.py'
      - 'fortunehire/scripts/pcsx_public.py'
      - 'fortunehire/scripts/home_depot_public.py'
      - 'fortunehire/test/test_crawler_rules.py'
      - 'fortunehire/test/test_pcsx.py'
      - 'fortunehire/test/test_home_depot.py'
      - 'fortunehire/scripts/employer_adapters.py'
      - 'fortunehire/test/test_oracle_company.py'
      - 'fortunehire/scripts/employer_sources.py'
      - 'fortunehire/scripts/apple_public.py'
      - 'fortunehire/test/test_apple.py'
      - 'fortunehire/test/test_fannie.py'
      - 'fortunehire/test/test_salesforce.py'
      - 'fortunehire/scripts/salesforce_details.py'
      - 'fortunehire/test/test_employer_sources.py'
      - 'fortunehire/test/test_public_search.py'
      - 'fortunehire/test/test_valero.py'
      - 'fortunehire/scripts/collection_health.py'
      - 'fortunehire/test/test_collection_health.py'
      - 'fortunehire/test/test_employer_adapters.py'
      - 'fortunehire/public/data/job-sources.json'
      - 'fortunehire/test/test_collector.py'
      - 'fortunehire/test/test_title_employment.py'
      - 'fortunehire/test/test_refresh_repair.py'
permissions:
  contents: write
concurrency:
  group: fortunehire-job-refresh
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fortunehire
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test lifecycle and filters before collection
        run: |
          python -m unittest discover -s test -p 'test_*.py' -v
          npm test
      - name: Check employer postings
        id: collect
        continue-on-error: true
        run: python scripts/collect_jobs.py --max-new "${{ github.event_name == 'push' && '0' || '20' }}"
      - name: Validate the publication dataset
        run: node scripts/validate-jobs.mjs
      - name: Record refresh status
        if: always()
        run: |
          if [ -f public/data/collection-status.json ]; then
            echo '### Official job collection' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat public/data/collection-status.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish validated data and retain previous successful records
        run: python scripts/publish_refresh.py
      - name: Flag any collection failure
        if: steps.collect.outcome == 'failure'
        run: python scripts/collection_health.py




