name: Verify remaining policy and service blockers
on:
  push:
    paths: ['.github/workflows/review-remaining-public.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check exact published destinations without bypasses
        working-directory: fortunehire
        run: |
          python - <<'PY'
          import sys,json,urllib.request,urllib.error
          sys.path.insert(0,'scripts')
          import collect_jobs as c
          from employer_adapters import Document
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args):return None
          opener=urllib.request.build_opener(NoRedirect())
          for company,url in [('apple','https://apple.com/pagenotfound'),('ibm','https://www-api.ibm.com/robots.txt')]:
              row={'companyId':company,'url':url,'chain':[]}
              for hop in range(5):
                  try:
                      with opener.open(urllib.request.Request(url,headers={'User-Agent':c.UA}),timeout=30) as response:
                          row['chain'].append({'url':url,'status':response.status,'type':response.headers.get('Content-Type')});break
                  except urllib.error.HTTPError as response:
                      target=response.headers.get('Location')
                      row['chain'].append({'url':url,'status':response.code,'redirect':target})
                      if company=='apple' and response.code in (301,302,307,308) and target and c.urllib.parse.urlsplit(target).netloc in ('apple.com','www.apple.com') and c.urllib.parse.urlsplit(target).scheme=='https':
                          url=target;continue
                      break
                  except Exception as e:row['error']=str(e);break
              print('BLOCKER_REVIEW',json.dumps(row),flush=True)
          row={'companyId':'delta'}
          try:
              cl=c.Client('delta.avature.net')
              status,body=cl.get('https://delta.avature.net/careers')
              row.update(status=status,length=len(body))
              row['jobLinks']=list(dict.fromkeys(n['attrs']['href'] for n in Document(body).nodes if n['tag']=='a' and 'JobDetail' in n['attrs'].get('href','')))[:2]
          except Exception as e:row['error']=str(e)
          print('BLOCKER_REVIEW',json.dumps(row),flush=True)
          PY
