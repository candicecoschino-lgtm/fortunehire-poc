name: Inspect Apple individual posting metadata
on:
  push:
    paths: ['.github/workflows/review-remaining-public.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check verified corporate robots redirect and job metadata
        working-directory: fortunehire
        run: |
          python - <<'PY'
          import sys,json,urllib.request,xml.etree.ElementTree as ET
          sys.path.insert(0,'scripts')
          import collect_jobs as c
          from employer_adapters import Document
          class ApplePolicy(c.RestrictedRedirect):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  allowed={('https://jobs.apple.com/robots.txt','https://apple.com/pagenotfound'),('https://apple.com/pagenotfound','https://www.apple.com/pagenotfound')}
                  if self.host=='jobs.apple.com' and (req.full_url,newurl) in allowed:
                      return urllib.request.HTTPRedirectHandler.redirect_request(self,req,fp,code,msg,headers,newurl)
                  return super().redirect_request(req,fp,code,msg,headers,newurl)
          c.RestrictedRedirect=ApplePolicy
          row={'companyId':'apple'}
          try:
              cl=c.Client('jobs.apple.com');row['policyResolved']=True
              status,body=cl.get('https://jobs.apple.com/en-us/search');row['searchStatus']=status
              row['roleLinks']=list(dict.fromkeys(n['attrs']['href'] for n in Document(body).nodes if n['tag']=='a' and '/details/' in n['attrs'].get('href','')))[:5]
              row['structuredJobs']=len([j for s in c.Page(body).scripts for j in c.postings(json.loads(s))])
              row['roleMetadata']=[]
              urls=[u for u in row['roleLinks'] if not u.split('?')[0].endswith('/locationPicker')]
              for link in urls[:2]:
                  url=c.urllib.parse.urljoin('https://jobs.apple.com',link)
                  role_status,role_body=cl.get(url)
                  roles=[{k:v for k,v in j.items() if k not in ('description','responsibilities','qualifications')} for s in c.Page(role_body).scripts for j in c.postings(json.loads(s))]
                  row['roleMetadata'].append({'url':url,'status':role_status,'canonical':c.Page(role_body).canonical,'postings':roles})
          except Exception as e:row['error']=str(e)
          print('APPLE_REVIEW',json.dumps(row))
          PY
